[workspace]
members = [
    "crates/gcodekit5-core",
    "crates/gcodekit5-communication",
    "crates/gcodekit5-camtools",
    "crates/gcodekit5-designer",
    "crates/gcodekit5-visualizer",
    "crates/gcodekit5-settings",
    "crates/gcodekit5-devicedb",
    "crates/gcodekit5-app",
    "crates/gcodekit5-ui-egui",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["GCodeKit Contributors"]
repository = "https://github.com/thawkins/gcodekit5"

[workspace.dependencies]
tracing = "0.1"
anyhow = "1.0"
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.8"

# egui front end (ADR-011). egui family must match the craft-libs pin; the
# [patch.crates-io] block below replicates craft-libs' egui/winit forks.
egui = { version = "0.37", default-features = false }
# `links`: egui-winit opens the URL of a clicked hyperlink (the help browser's web links).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui_extras = { version = "0.37", default-features = false }
# Window handles for craft-dialogs' parent window (the version eframe and craft-dialogs use).
raw-window-handle = "0.6.2"
egui_kittest = "0.37"
egui-wgpu = "0.37"
# Shared by the visualizer crates (the egui front end's wgpu visualizer).
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-platform = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-svg = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-dxf = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "d15bf1f35b17b759870f9e5111b9a5d243f64888" }

[package]
name = "gcodekit5-design"
autotests = false
version.workspace = true
edition.workspace = true
description = "A Rust-based Universal G-Code Sender for Laser and CNC machines with support for GRBL, TinyG, g2core, Smoothieware, and FluidNC controllers"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

# The binary keeps the product name that the release workflow, the
# Windows installer, the flatpak and the desktop file expect.
[[bin]]
name = "gcodekit5"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[dependencies]
gcodekit5-ui-egui = { path = "crates/gcodekit5-ui-egui" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
anyhow = "1.0"

[package.metadata.deb]
maintainer = "GCodeKit Contributors"
copyright = "2025, GCodeKit Contributors"
depends = "$auto, libxkbcommon-x11-0, libvulkan1 | libegl1"
section = "utility"
priority = "optional"
assets = [
    ["target/release/gcodekit5", "usr/bin/", "755"],
    ["assets/pictures/com.github.thawkins.gcodekit5.png", "usr/share/icons/hicolor/256x256/apps/com.github.thawkins.gcodekit5.png", "644"],
    ["flatpak/com.github.thawkins.gcodekit5.desktop", "usr/share/applications/com.github.thawkins.gcodekit5.desktop", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gcodekit5", dest = "/usr/bin/gcodekit5", mode = "755" },
    { source = "assets/pictures/com.github.thawkins.gcodekit5.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.github.thawkins.gcodekit5.png", mode = "644" },
    { source = "flatpak/com.github.thawkins.gcodekit5.desktop", dest = "/usr/share/applications/com.github.thawkins.gcodekit5.desktop", mode = "644" },
]

# Libraries winit and wgpu dlopen at run time (not in the ELF NEEDED list, so
# auto-req cannot see them); auto-req still adds libc, libudev, etc.
[package.metadata.generate-rpm.requires]
libxkbcommon-x11 = "*"
vulkan-loader = "*"

[dev-dependencies]
mutants = "0.0.4"

[patch.crates-io]
core2 = { git = "https://github.com/bbqsrc/core2", rev = "545e84bcb0f235b12e21351e0c69767958efe2a7" }
# craft-libs patches egui/winit to forks; patches do not propagate to dependents (ADR-011).
# Add egui_extras / egui_system_font_provider here when a crate first uses them.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[[test]]
name = "all"
path = "tests/all.rs"

[workspace.lints.cargo]
# Workspace deps for craft-libs are declared ahead of the crates that use them (ADR-011).
# The root package opts in via [lints] workspace = true so cargo stops warning about them.
unused_workspace_dependencies = "allow"
