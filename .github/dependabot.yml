# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # csgrs (latest 0.20.1) depends on nalgebra 0.33 and exchanges nalgebra
      # types with our crates, so a newer nalgebra cannot build until csgrs
      # updates (see #107). Remove this entry when it does.
      - dependency-name: "nalgebra"
        versions: [">=0.34"]
      # Bump together with the craft-libs rev: egui 0.37 is what craft-libs
      # pins at d15bf1f (ADR-011).
      - dependency-name: "egui"
        versions: [">=0.38"]
      - dependency-name: "eframe"
        versions: [">=0.38"]
      - dependency-name: "egui_*"
        versions: [">=0.38"]
      - dependency-name: "egui-*"
        versions: [">=0.38"]
      - dependency-name: "epaint"
        versions: [">=0.38"]
      - dependency-name: "emath"
        versions: [">=0.38"]
      - dependency-name: "ecolor"
        versions: [">=0.38"]
    groups:
      # egui family bumps together (and with the craft-libs rev).
      egui:
        patterns: ["egui", "eframe", "egui_*", "egui-*", "epaint", "emath", "ecolor"]
      # Group minor and patch updates to reduce PR noise
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
