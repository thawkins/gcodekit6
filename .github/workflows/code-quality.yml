name: Code Quality

on:
  push:
    branches: [master, develop, devel]
  pull_request:
    branches: [master, develop, devel]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy-strict:
    name: Clippy (warnings are errors)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      # Fails (exit 1) when any manifest declares a dependency its crate never uses.
      - name: Check for unused dependencies
        run: cargo machete

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: check-no-gtk
        run: "! cargo tree --workspace -e normal | grep -E '^.*(gtk4|libadwaita|sourceview5|glib-sys) '"

      # unwrap_used becomes an error through -D warnings.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::unwrap_used

  nextest:
    name: Tests (nextest)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nextest-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo nextest run --workspace --profile ci
        env:
          WGPU_BACKEND: vulkan

      # Review Focus 2: the egui editor draws a 1,000,000-line file, and a keystroke in a 49,999-line file, within frame budgets.
      # Ignored in the default run (generating the file is slow), so it runs here on its own.
      - name: Run large-file frame-time test
        run: cargo nextest run -p gcodekit6-ui-egui --profile ci --run-ignored only -E 'test(test_large_file_frame_time) + test(test_near_threshold_edit_frame_time)'
        env:
          WGPU_BACKEND: vulkan

      - name: Upload kittest snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kittest-snapshot-diffs
          path: |
            crates/gcodekit6-ui-egui/tests/snapshots/**/*.diff.png
            crates/gcodekit6-ui-egui/tests/snapshots/**/*.new.png
          if-no-files-found: ignore

      - name: Run doc tests
        run: cargo test --workspace --doc

  fmt-check:
    name: Format Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run dependency checks
        run: cargo deny check

  benchmarks:
    name: Benchmarks compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify benchmarks compile
        run: cargo bench --no-run --workspace
