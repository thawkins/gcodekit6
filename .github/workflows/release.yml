name: Build and Release

on:
  push:
    tags: [ "v*" ]
  # Release dry run: builds the matrix and uploads the artefacts; every
  # publishing step is guarded by startsWith(github.ref, 'refs/tags/').
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: gcodekit5
            name_suffix: linux-x86_64
          - os_name: macOS-ARM64
            os: macos-14
            target: aarch64-apple-darwin
            bin: gcodekit5
            name_suffix: macos-arm64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: gcodekit5.exe
            name_suffix: windows-x86_64
        
    steps:
    - uses: actions/checkout@v7

    - name: Set Asset Name
      shell: bash
      run: echo "ASSET_NAME=gcodekit5-${{ github.ref_name }}-${{ matrix.platform.name_suffix }}" >> $GITHUB_ENV

    - name: Install Linux Dependencies
      if: matrix.platform.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers \
          flatpak flatpak-builder libfuse2
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform.target }}

    - name: Build (macOS)
      if: startsWith(matrix.platform.os_name, 'macOS')
      run: |
        cargo build --release --target ${{ matrix.platform.target }}

        # Create app bundle
        mkdir -p "GCodeKit.app/Contents/MacOS"
        mkdir -p "GCodeKit.app/Contents/Resources"

        # Copy the binary
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} "GCodeKit.app/Contents/MacOS/gcodekit5"

        # Generate the app icon (.icns) from the 256x256 PNG
        ICONSET="target/AppIcon.iconset"
        mkdir -p "$ICONSET"
        SRC=assets/pictures/com.github.thawkins.gcodekit5.png
        for size in 16 32 128 256; do
          sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png"
        done
        for size in 16 32 128; do
          double=$((size * 2))
          sips -z $double $double "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"
        done
        iconutil -c icns "$ICONSET" -o "GCodeKit.app/Contents/Resources/AppIcon.icns"

        # Create Info.plist
        cat > "GCodeKit.app/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>gcodekit5</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.thawkins.gcodekit5</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>GCodeKit</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright © 2025 GCodeKit Contributors</string>
        </dict>
        </plist>
        EOF

        # Create DMG
        bash scripts/macos-create-dmg.sh "${{ github.ref_name }}" "${{ matrix.platform.name_suffix }}"

    - name: Build (Linux)
      if: matrix.platform.os_name == 'Linux-x86_64'
      run: |
        timeout 600 cargo build --release --target ${{ matrix.platform.target }}
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} ${{ env.ASSET_NAME }}
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} gcodekit5-linux-x86_64
        
        # Install packaging tools
        cargo install cargo-deb
        cargo install cargo-generate-rpm

        # Build Deb
        cargo deb --target ${{ matrix.platform.target }} --no-build --output gcodekit5-${{ github.ref_name }}-linux-x86_64.deb

        # Build RPM (rpm versions may not contain '-': 1.2.0-beta.2 -> 1.2.0~beta.2)
        PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gcodekit5-design") | .version')
        cargo generate-rpm --target ${{ matrix.platform.target }} \
          --set-metadata "version = \"${PKG_VERSION//-/\~}\"" \
          --output gcodekit5-${{ github.ref_name }}-linux-x86_64.rpm
        
        # Build Flatpak
        flatpak-builder --user --install-deps-from=flathub --force-clean build-dir flatpak/com.github.thawkins.gcodekit5.yml --repo=repo
        flatpak build-bundle repo gcodekit5-${{ github.ref_name }}-linux-x86_64.flatpak com.github.thawkins.gcodekit5

        # Build AppImage
        mkdir -p AppDir/usr/bin
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} AppDir/usr/bin/
        
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        
        export VERSION="${{ github.ref_name }}"
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --output appimage \
          --icon-file assets/pictures/com.github.thawkins.gcodekit5.png \
          --desktop-file flatpak/com.github.thawkins.gcodekit5.desktop \
          --executable AppDir/usr/bin/${{ matrix.platform.bin }}

        find . -maxdepth 1 -name "gcodekit5-*.AppImage" -exec mv {} gcodekit5-${{ github.ref_name }}-linux-x86_64.AppImage \;

    - name: Build (Windows)
      if: matrix.platform.os == 'windows-latest'
      shell: pwsh
      run: |
        cargo build --release --target ${{ matrix.platform.target }}

        # Portable distribution: the executable and the licence, nothing else
        New-Item -ItemType Directory -Force -Path "dist\gcodekit5" | Out-Null
        Copy-Item "target\${{ matrix.platform.target }}\release\${{ matrix.platform.bin }}" "dist\gcodekit5\"
        Copy-Item "wix\License.rtf" "dist\gcodekit5\"

    - name: Create Windows MSI Installer
      if: matrix.platform.os == 'windows-latest'
      shell: pwsh
      run: |
        cargo install cargo-wix

        # The package is gcodekit5-design; its binary is gcodekit5.exe
        cargo wix --package gcodekit5-design --target ${{ matrix.platform.target }} --no-build --nocapture -o gcodekit5-${{ github.ref_name }}-windows-x86_64.msi

        Compress-Archive -Path "dist\gcodekit5\*" -DestinationPath "gcodekit5-${{ github.ref_name }}-windows-x86_64-portable.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET_NAME }}
        path: |
          ${{ env.ASSET_NAME }}
          *.app
          *.dmg
          *.flatpak
          *.deb
          *.rpm
          *.AppImage
          *.msi
          *-portable.zip
        if-no-files-found: warn

    - name: Build Changelog
      id: build_changelog
      if: matrix.platform.os_name == 'Linux-x86_64' && startsWith(github.ref, 'refs/tags/')
      uses: mikepenz/release-changelog-builder-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE }}

    - name: Release (Linux)
      if: matrix.platform.os_name == 'Linux-x86_64' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE }}
        body: ${{ steps.build_changelog.outputs.changelog }}
        files: |
          ${{ env.ASSET_NAME }}
          *.flatpak
          *.deb
          *.rpm
          *.AppImage

    - name: Release (macOS)
      if: startsWith(matrix.platform.os_name, 'macOS') && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE }}
        files: |
          *.dmg

    - name: Release (Windows)
      if: matrix.platform.os_name == 'Windows-x86_64' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE }}
        files: |
          *.msi
          *-portable.zip

    - name: Release (Other)
      if: matrix.platform.os_name != 'Linux-x86_64' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE }}
        files: |
          ${{ env.ASSET_NAME }}
