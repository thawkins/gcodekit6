name: Build and Release

on:
  push:
    tags: [ "v*" ]
  # Release dry run: a dispatch only builds the matrix and uploads the
  # artefacts, even on a tag ref. Every publishing step requires a tag push
  # (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')).
  workflow_dispatch:

# Publishing uses the workflow's own token unless a RELEASE secret is set.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: gcodekit6
            name_suffix: linux-x86_64
          - os_name: macOS-ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: gcodekit6
            name_suffix: macos-arm64
          - os_name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: gcodekit6.exe
            name_suffix: windows-x86_64
        
    steps:
    - uses: actions/checkout@v7

    - name: Set Asset Name
      shell: bash
      run: |
        # REF_SLUG names every artefact: the tag on a release, the ref with
        # '/' replaced by '-' on a dry run (branch names like claude/egui-m7).
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          REF_SLUG="$GITHUB_REF_NAME"
        else
          REF_SLUG="${GITHUB_REF_NAME//\//-}"
        fi
        # PKG_VERSION: Cargo.toml version (e.g. 1.2.0-beta.2).
        # CARGO_NUM_VERSION: its numeric x.y.z part (WiX install version).
        # BUNDLE_VERSION: numeric macOS bundle version - the tag without the
        # leading 'v' and prerelease suffix, or CARGO_NUM_VERSION on a dry run.
        PKG_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml | tr -d '\r')
        CARGO_NUM_VERSION="${PKG_VERSION%%[-+]*}"
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          BUNDLE_VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_VERSION="${BUNDLE_VERSION%%[-+]*}"
        else
          BUNDLE_VERSION="$CARGO_NUM_VERSION"
        fi
        {
          echo "REF_SLUG=$REF_SLUG"
          echo "PKG_VERSION=$PKG_VERSION"
          echo "CARGO_NUM_VERSION=$CARGO_NUM_VERSION"
          echo "BUNDLE_VERSION=$BUNDLE_VERSION"
          echo "ASSET_NAME=gcodekit6-$REF_SLUG-${{ matrix.platform.name_suffix }}"
        } >> "$GITHUB_ENV"

    - name: Install Linux Dependencies
      if: matrix.platform.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers \
          flatpak flatpak-builder libfuse2
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform.target }}

    - name: Build (macOS)
      if: startsWith(matrix.platform.os_name, 'macOS')
      run: |
        cargo build --release --target ${{ matrix.platform.target }}

        # Create app bundle
        mkdir -p "GCodeKit.app/Contents/MacOS"
        mkdir -p "GCodeKit.app/Contents/Resources"

        # Copy the binary
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} "GCodeKit.app/Contents/MacOS/gcodekit6"

        # Generate the app icon (.icns) from the 256x256 PNG
        ICONSET="target/AppIcon.iconset"
        mkdir -p "$ICONSET"
        SRC=assets/pictures/com.github.thawkins.gcodekit6.png
        for size in 16 32 128 256; do
          sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png"
        done
        for size in 16 32 128; do
          double=$((size * 2))
          sips -z $double $double "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png"
        done
        iconutil -c icns "$ICONSET" -o "GCodeKit.app/Contents/Resources/AppIcon.icns"

        # Create Info.plist
        cat > "GCodeKit.app/Contents/Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>gcodekit6</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.thawkins.gcodekit6</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>GCodeKit</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ env.BUNDLE_VERSION }}</string>
            <key>CFBundleVersion</key>
            <string>${{ env.BUNDLE_VERSION }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright © 2025 GCodeKit Contributors</string>
        </dict>
        </plist>
        EOF

        # Create DMG
        bash scripts/macos-create-dmg.sh "${{ env.REF_SLUG }}" "${{ matrix.platform.name_suffix }}"

    - name: Build (Linux)
      if: matrix.platform.os_name == 'Linux-x86_64'
      run: |
        timeout 1800 cargo build --release --target ${{ matrix.platform.target }}
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} ${{ env.ASSET_NAME }}
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} gcodekit6-linux-x86_64
        
        # Install packaging tools
        cargo install cargo-deb
        cargo install cargo-generate-rpm

        # Build Deb
        cargo deb --target ${{ matrix.platform.target }} --no-build --output gcodekit6-${{ env.REF_SLUG }}-linux-x86_64.deb

        # Build RPM (rpm versions may not contain '-': 1.2.0-beta.2 -> 1.2.0~beta.2)
        cargo generate-rpm --target ${{ matrix.platform.target }} \
          --set-metadata "version = \"${PKG_VERSION//-/\~}\"" \
          --output gcodekit6-${{ env.REF_SLUG }}-linux-x86_64.rpm
        
        # Build Flatpak
        flatpak-builder --user --install-deps-from=flathub --force-clean build-dir flatpak/com.github.thawkins.gcodekit6.yml --repo=repo
        flatpak build-bundle repo gcodekit6-${{ env.REF_SLUG }}-linux-x86_64.flatpak com.github.thawkins.gcodekit6

        # Build AppImage
        mkdir -p AppDir/usr/bin
        cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.bin }} AppDir/usr/bin/
        
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        
        export VERSION="${{ env.REF_SLUG }}"
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --output appimage \
          --icon-file assets/pictures/com.github.thawkins.gcodekit6.png \
          --desktop-file flatpak/com.github.thawkins.gcodekit6.desktop \
          --executable AppDir/usr/bin/${{ matrix.platform.bin }}

        find . -maxdepth 1 -name "gcodekit6-*.AppImage" -exec mv {} gcodekit6-${{ env.REF_SLUG }}-linux-x86_64.AppImage \;

    - name: Build (Windows)
      if: matrix.platform.os == 'windows-latest'
      shell: pwsh
      run: |
        cargo build --release --target ${{ matrix.platform.target }}

        # Portable distribution: the executable and the licence, nothing else
        New-Item -ItemType Directory -Force -Path "dist\gcodekit6" | Out-Null
        Copy-Item "target\${{ matrix.platform.target }}\release\${{ matrix.platform.bin }}" "dist\gcodekit6\"
        Copy-Item "wix\License.rtf" "dist\gcodekit6\"

    - name: Install WiX Toolset v3
      if: matrix.platform.os == 'windows-latest'
      shell: pwsh
      run: |
        # The runner image may already ship WiX v3 (choco then refuses a
        # pinned reinstall); install it only when no v3 folder exists.
        function Find-Wix {
          Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending | Select-Object -First 1
        }
        $wix = Find-Wix
        if (-not $wix) {
          choco install wixtoolset -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install wixtoolset failed" }
          $wix = Find-Wix
        }
        if (-not $wix) { throw "WiX Toolset v3 not found after install" }
        Write-Host "Using $($wix.FullName)"
        # cargo-wix finds candle.exe/light.exe through WIX (or PATH)
        "WIX=$($wix.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Create Windows MSI Installer
      if: matrix.platform.os == 'windows-latest'
      shell: pwsh
      run: |
        cargo install cargo-wix

        # The package is gcodekit6-design; its binary is gcodekit6.exe
        cargo wix --package gcodekit6-design --target ${{ matrix.platform.target }} --no-build --nocapture --install-version ${{ env.CARGO_NUM_VERSION }} -o gcodekit6-${{ env.REF_SLUG }}-windows-x86_64.msi

        Compress-Archive -Path "dist\gcodekit6\*" -DestinationPath "gcodekit6-${{ env.REF_SLUG }}-windows-x86_64-portable.zip"

    - name: Upload Artifact (Linux)
      if: matrix.platform.os_name == 'Linux-x86_64'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET_NAME }}
        path: |
          ${{ env.ASSET_NAME }}
          *.deb
          *.rpm
          *.flatpak
          gcodekit6-*.AppImage
        if-no-files-found: error

    - name: Upload Artifact (macOS)
      if: startsWith(matrix.platform.os_name, 'macOS')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET_NAME }}
        path: "*.dmg"
        if-no-files-found: error

    - name: Upload Artifact (Windows)
      if: matrix.platform.os_name == 'Windows-x86_64'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET_NAME }}
        path: |
          *.msi
          *-portable.zip
        if-no-files-found: error

    - name: Build Release Notes
      # The notes are every CHANGELOG.md section for this version, plus older
      # versions that never had a published release (scripts/release_notes.py).
      # A tag push fails here when CHANGELOG.md has no section for its version;
      # a dry run only checks the Cargo.toml version and never fails.
      if: matrix.platform.os_name == 'Linux-x86_64'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASE || github.token }}
      run: |
        if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
          version="${GITHUB_REF_NAME#v}"
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --limit 100 --json tagName -q '[.[].tagName] | join(",")')
          python3 -I scripts/release_notes.py "$version" --out release_notes.md \
            --published "$published" --repo "$GITHUB_REPOSITORY"
        else
          python3 -I scripts/release_notes.py "$PKG_VERSION" --out release_notes.md \
            --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::CHANGELOG.md has no section for $PKG_VERSION yet"
        fi
        if [[ -f release_notes.md ]]; then cat release_notes.md >> "$GITHUB_STEP_SUMMARY"; fi

    - name: Release (Linux)
      if: matrix.platform.os_name == 'Linux-x86_64' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE || github.token }}
        # A version with a suffix (v2.0.0-alpha.2) is published as a pre-release
        prerelease: ${{ contains(github.ref_name, '-') }}
        body_path: release_notes.md
        files: |
          ${{ env.ASSET_NAME }}
          *.flatpak
          *.deb
          *.rpm
          gcodekit6-*.AppImage

    - name: Release (macOS)
      if: startsWith(matrix.platform.os_name, 'macOS') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE || github.token }}
        # A version with a suffix (v2.0.0-alpha.2) is published as a pre-release
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          *.dmg

    - name: Release (Windows)
      if: matrix.platform.os_name == 'Windows-x86_64' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.RELEASE || github.token }}
        # A version with a suffix (v2.0.0-alpha.2) is published as a pre-release
        prerelease: ${{ contains(github.ref_name, '-') }}
        files: |
          *.msi
          *-portable.zip
