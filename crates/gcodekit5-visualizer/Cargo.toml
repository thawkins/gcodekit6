[package]
name = "gcodekit5-visualizer"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "G-code visualization and parsing for GCodeKit4"

[dependencies]
gcodekit5-core = { path = "../gcodekit5-core" }
regex = "1.10"
serde = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
gcodekit5-camtools = { path = "../gcodekit5-camtools" }
proptest = "1.4"
tempfile = { workspace = true }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "pipeline_bench"
harness = false

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
