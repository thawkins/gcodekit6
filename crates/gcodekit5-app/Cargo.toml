[package]
name = "gcodekit5-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Toolkit-free application state shared by the GCodeKit5 front ends"
autotests = false

[dependencies]
gcodekit5-core = { path = "../gcodekit5-core" }
gcodekit5-communication = { path = "../gcodekit5-communication" }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
dirs = "7.0"

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
