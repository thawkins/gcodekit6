[package]
name = "gcodekit6-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui + craft-libs front end for GCodeKit6"
autotests = false

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true, features = ["svg"] }
eframe = { workspace = true }
egui-wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
lyon = "1.0"
rusttype = "0.9.3"
craft-ui = { workspace = true }
craft-window = { workspace = true, features = ["egui"] }
craft-platform = { workspace = true, features = ["egui", "appearance"] }
craft-keymap = { workspace = true, features = ["egui"] }
craft-menu = { workspace = true }
craft-dialogs = { workspace = true }
craft-quit = { workspace = true, features = ["egui"] }
raw-window-handle = { workspace = true }
gcodekit6-app = { path = "../gcodekit6-app" }
gcodekit6-camtools = { path = "../gcodekit6-camtools" }
gcodekit6-communication = { path = "../gcodekit6-communication" }
gcodekit6-core = { path = "../gcodekit6-core" }
gcodekit6-designer = { path = "../gcodekit6-designer" }
gcodekit6-devicedb = { path = "../gcodekit6-devicedb" }
gcodekit6-settings = { path = "../gcodekit6-settings" }
gcodekit6-visualizer = { path = "../gcodekit6-visualizer" }
image = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# Test hooks (e.g. the visualizer build panic hook) that must not ship in production.
test-support = []

[dev-dependencies]
gcodekit6-ui-egui = { path = ".", features = ["test-support"] }
gcodekit6-app = { path = "../gcodekit6-app", features = ["test-support"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
