[package]
name = "gcodekit5-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui + craft-libs front end for GCodeKit5"
autotests = false

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui-wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
lyon = "1.0"
rusttype = "0.9.3"
craft-ui = { workspace = true, features = ["serde"] }
craft-window = { workspace = true, features = ["egui"] }
craft-platform = { workspace = true, features = ["egui", "appearance"] }
craft-keymap = { workspace = true, features = ["egui"] }
craft-menu = { workspace = true }
craft-dialogs = { workspace = true }
craft-quit = { workspace = true, features = ["egui"] }
raw-window-handle = { workspace = true }
gcodekit5-app = { path = "../gcodekit5-app" }
gcodekit5-camtools = { path = "../gcodekit5-camtools" }
gcodekit5-communication = { path = "../gcodekit5-communication" }
gcodekit5-core = { path = "../gcodekit5-core" }
gcodekit5-designer = { path = "../gcodekit5-designer" }
gcodekit5-devicedb = { path = "../gcodekit5-devicedb" }
gcodekit5-settings = { path = "../gcodekit5-settings" }
gcodekit5-visualizer = { path = "../gcodekit5-visualizer" }
image = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# Test hooks (e.g. the visualizer build panic hook) that must not ship in production.
test-support = []

[dev-dependencies]
gcodekit5-ui-egui = { path = ".", features = ["test-support"] }
gcodekit5-app = { path = "../gcodekit5-app", features = ["test-support"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
