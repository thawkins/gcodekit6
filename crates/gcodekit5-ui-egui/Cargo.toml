[package]
name = "gcodekit5-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "egui + craft-libs front end for GCodeKit5"
autotests = false

[dependencies]
anyhow = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
craft-ui = { workspace = true, features = ["serde"] }
craft-window = { workspace = true, features = ["egui"] }
craft-platform = { workspace = true, features = ["egui", "appearance"] }
craft-keymap = { workspace = true, features = ["egui"] }
craft-menu = { workspace = true }
craft-dialogs = { workspace = true }
craft-quit = { workspace = true, features = ["egui"] }
raw-window-handle = { workspace = true }
gcodekit5-app = { path = "../gcodekit5-app" }
gcodekit5-settings = { path = "../gcodekit5-settings" }
serde = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
