[package]
name = "gcodekit5-communication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Communication protocols (Serial, TCP, WebSocket) for GCodeKit5"
autotests = false

[dependencies]
gcodekit5-core = { path = "../gcodekit5-core" }
serialport = "4.3"
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Blocking WebSocket client for FluidNC/grblHAL boards; plain ws:// only, so no TLS.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
proptest = "1.4"

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
