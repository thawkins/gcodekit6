[package]
name = "gcodekit5-settings"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Configuration and settings management for GCodeKit4"

[dependencies]
gcodekit5-core = { path = "../gcodekit5-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
dirs = "7.0"
tracing = "0.1"
thiserror = { workspace = true }
craft-settings = { workspace = true }

[build-dependencies]
# Parses po/*.po into the embedded translation tables (src/i18n.rs); no msgfmt.
polib = "0.3"

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
