[package]
name = "gcodekit6-designer"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Design and CAM layout tools for GCodeKit6 - Create complex toolpaths visually"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gcodekit6-core = { path = "../gcodekit6-core" }
gcodekit6-camtools = { path = "../gcodekit6-camtools" }
serde = { workspace = true }
serde_json = { workspace = true }
image = "0.25"
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
lyon = { version = "1.0", features = ["serialization"] }
rusttype = "0.9.3"
fontdb = "0.24"
cavalier_contours = "0.9.0"
csgrs = { version = "0.20.1", features = ["svg-io", "stl-io"] }
stl_io = "0.11"
nalgebra = "0.33.3"
smallvec = { version = "1.13", features = ["const_generics"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "toolpath_bench"
harness = false

[[test]]
name = "all"
path = "tests/all.rs"

[lints]
workspace = true
