# cargo-nextest configuration (https://nexte.st/docs/configuration/).
# Every test runs in its own process; a test still running after 150 s
# (30 s x 5) is killed and reported as a failure instead of stalling the run.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 5 }
failure-output = "immediate-final"

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 5 }
failure-output = "immediate-final"
fail-fast = false

# egui_kittest renders through wgpu (lavapipe on CI runners without a GPU),
# which is slow; bound concurrency so tests stay under the 150 s kill timeout.
[test-groups]
gpu = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(gcodekit6-ui-egui)'
test-group = "gpu"

[[profile.ci.overrides]]
filter = 'package(gcodekit6-ui-egui)'
test-group = "gpu"
