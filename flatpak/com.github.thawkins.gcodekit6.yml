app-id: com.github.thawkins.gcodekit6
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: gcodekit6
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --share=network
modules:
  - name: gcodekit6
    buildsystem: simple
    build-commands:
      - install -D -m 755 gcodekit6 /app/bin/gcodekit6
      - install -D com.github.thawkins.gcodekit6.png /app/share/icons/hicolor/128x128/apps/com.github.thawkins.gcodekit6.png
      - install -D com.github.thawkins.gcodekit6.desktop /app/share/applications/com.github.thawkins.gcodekit6.desktop
      - install -D com.github.thawkins.gcodekit6.metainfo.xml /app/share/metainfo/com.github.thawkins.gcodekit6.metainfo.xml
    sources:
      - type: file
        path: ../gcodekit6-linux-x86_64
        dest-filename: gcodekit6
      - type: file
        path: ../assets/pictures/com.github.thawkins.gcodekit6.png
        dest-filename: com.github.thawkins.gcodekit6.png
      - type: file
        path: com.github.thawkins.gcodekit6.desktop
      - type: file
        path: com.github.thawkins.gcodekit6.metainfo.xml
